name: Обновление приложения мастера
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например master-v0.2.4
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: master-update-json
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'master-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить APK и обновить master-update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, glob, json, os, re, subprocess, sys, tempfile, urllib.error, urllib.parse, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'garnes310/PestBusterCRM-Updates':
              sys.exit('Этот сценарий настроен для репозитория PestBusterCRM-Updates.')
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          if os.environ['GITHUB_EVENT_NAME'] == 'release':
              tag = event['release']['tag_name']
          else:
              tag = event.get('inputs', {}).get('tag', '').strip()
          if not re.fullmatch(r'master-v[0-9]+(?:\.[0-9]+){1,3}', tag):
              sys.exit('Тег должен иметь вид master-v0.2.4.')
          api = 'https://api.github.com/repos/' + repo
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'master-update-workflow'}
          def request(url, payload=None):
              h = dict(headers)
              if payload is not None:
                  h['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=json.dumps(payload).encode() if payload is not None else None, headers=h, method='PUT' if payload is not None else 'GET')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          release = request(api + '/releases/tags/' + urllib.parse.quote(tag, safe=''))
          if release.get('draft') or release.get('prerelease') or not release.get('published_at'):
              sys.exit('Нужен опубликованный релиз без отметки Pre-release.')
          assets = [a for a in release.get('assets', []) if a.get('name') == 'app-pestbuster-release.apk' and a.get('state') == 'uploaded']
          if len(assets) != 1:
              sys.exit('В релизе должен быть один загруженный app-pestbuster-release.apk. Добавьте его и запустите проверку вручную.')
          asset = assets[0]
          if not 0 < asset['size'] <= 100 * 1024 * 1024:
              sys.exit('Неожиданный размер APK.')
          url = 'https://github.com/' + repo + '/releases/download/' + tag + '/app-pestbuster-release.apk'
          if asset.get('browser_download_url') != url:
              sys.exit('Адрес APK не совпадает с ожидаемым.')
          tools = glob.glob(os.path.join(os.environ.get('ANDROID_HOME', os.environ.get('ANDROID_SDK_ROOT', '')), 'build-tools', '*'))
          tools = sorted(tools, key=lambda p: tuple(int(x) for x in re.findall(r'\d+', os.path.basename(p))), reverse=True)
          if not tools:
              sys.exit('На исполнителе GitHub Actions не найден Android SDK Build Tools.')
          build = next((p for p in tools if os.path.isfile(os.path.join(p, 'aapt2')) and os.path.isfile(os.path.join(p, 'apksigner'))), None)
          if not build:
              sys.exit('Не найдены aapt2 и apksigner.')
          with tempfile.TemporaryDirectory() as folder:
              apk = os.path.join(folder, 'master.apk')
              req = urllib.request.Request(url, headers={'User-Agent':'master-update-workflow'})
              with urllib.request.urlopen(req, timeout=120) as r, open(apk, 'wb') as out:
                  received = 0
                  while True:
                      block = r.read(1024 * 1024)
                      if not block: break
                      received += len(block)
                      if received > asset['size']: sys.exit('Размер загруженного APK не совпал.')
                      out.write(block)
              if received != asset['size']: sys.exit('APK скачан не полностью.')
              subprocess.run([os.path.join(build, 'apksigner'), 'verify', apk], check=True)
              details = subprocess.check_output([os.path.join(build, 'aapt2'), 'dump', 'badging', apk], text=True)
              line = next((v for v in details.splitlines() if v.startswith('package: ')), '')
              fields = dict(re.findall(r"([A-Za-z][A-Za-z0-9]*)='([^']*)'", line))
              if fields.get('name') != 'ru.pestbuster.master': sys.exit('APK относится к другому приложению.')
              ver = fields.get('versionName', '')
              if tag != 'master-v' + ver: sys.exit('Тег релиза не совпадает с versionName внутри APK.')
              code = int(fields.get('versionCode', '0'))
              if not 0 < code <= 2100000000: sys.exit('Неверный versionCode внутри APK.')
          current = request(api + '/contents/master-update.json?ref=main')
          if current.get('encoding') != 'base64' or current.get('size', 0) > 16384:
              sys.exit('Не удалось прочитать существующий master-update.json.')
          previous = json.loads(base64.b64decode(current['content']).decode('utf-8-sig'))
          if previous.get('applicationId') != 'ru.pestbuster.master':
              sys.exit('В master-update.json указан другой applicationId.')
          old_code = previous.get('versionCode')
          if type(old_code) is not int or old_code < 1: sys.exit('В master-update.json указан неверный versionCode.')
          update = dict(previous)
          update.update(applicationId='ru.pestbuster.master', versionCode=code, versionName=ver, apkUrl=url)
          if code < old_code: sys.exit('У старого релиза versionCode меньше актуального. Файл не изменён.')
          if code == old_code:
              if all(previous.get(k) == update[k] for k in ('applicationId', 'versionCode', 'versionName', 'apkUrl')):
                  print('Файл уже соответствует релизу: ' + tag); sys.exit(0)
              sys.exit('Такой versionCode уже используется. Увеличьте versionCode, соберите и опубликуйте новый APK.')
          content = json.dumps(update, ensure_ascii=False, indent=2) + '\n'
          request(api + '/contents/master-update.json', {'message':'Обновить приложение мастера до ' + ver, 'content':base64.b64encode(content.encode()).decode(), 'sha':current['sha'], 'branch':'main'})
          print('Готово: master-update.json обновлён для ' + tag)
          PYCODE

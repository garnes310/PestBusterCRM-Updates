              sys.exit('На исполнителе GitHub Actions не найден Android SDK Build Tools.')
          build = next((p for p in tools if os.path.isfile(os.path.join(p, 'aapt2')) and os.path.isfile(os.path.join(p, 'apksigner'))), None)
          if not build:
              sys.exit('Не найдены aapt2 и apksigner.')
          with tempfile.TemporaryDirectory() as folder:
              apk = os.path.join(folder, 'master.apk')
              req = urllib.request.Request(url, headers={'User-Agent':'master-update-workflow'})
              with urllib.request.urlopen(req, timeout=120) as r, open(apk, 'wb') as out:
                  received = 0
                  while True:
                      block = r.read(1024 * 1024)
                      if not block: break
                      received += len(block)
                      if received > asset['size']: sys.exit('Размер загруженного APK не совпал.')
                      out.write(block)
              if received != asset['size']: sys.exit('APK скачан не полностью.')
              subprocess.run([os.path.join(build, 'apksigner'), 'verify', apk], check=True)
              details = subprocess.check_output([os.path.join(build, 'aapt2'), 'dump', 'badging', apk], text=True)
              line = next((v for v in details.splitlines() if v.startswith('package: ')), '')
              fields = dict(re.findall(r"([A-Za-z][A-Za-z0-9]*)='([^']*)'", line))
              if fields.get('name') != 'ru.pestbuster.master': sys.exit('APK относится к другому приложению.')
              ver = fields.get('versionName', '')
              if tag != 'master-v' + ver: sys.exit('Тег релиза не совпадает с versionName внутри APK.')
              code = int(fields.get('versionCode', '0'))
              if not 0 < code <= 2100000000: sys.exit('Неверный versionCode внутри APK.')
          current = request(api + '/contents/master-update.json?ref=main')
          if current.get('encoding') != 'base64' or current.get('size', 0) > 16384:
              sys.exit('Не удалось прочитать существующий master-update.json.')
          previous = json.loads(base64.b64decode(current['content']).decode('utf-8-sig'))
          if previous.get('applicationId') != 'ru.pestbuster.master':
              sys.exit('В master-update.json указан другой applicationId.')
          old_code = previous.get('versionCode')
          if type(old_code) is not int or old_code < 1: sys.exit('В master-update.json указан неверный versionCode.')
          update = dict(previous)
          update.update(applicationId='ru.pestbuster.master', versionCode=code, versionName=ver, apkUrl=url)
          if code < old_code: sys.exit('У старого релиза versionCode меньше актуального. Файл не изменён.')
          if code == old_code:
              if all(previous.get(k) == update[k] for k in ('applicationId', 'versionCode', 'versionName', 'apkUrl')):
                  print('Файл уже соответствует релизу: ' + tag); sys.exit(0)
              sys.exit('Такой versionCode уже используется. Увеличьте versionCode, соберите и опубликуйте новый APK.')
          content = json.dumps(update, ensure_ascii=False, indent=2) + '\n'
          request(api + '/contents/master-update.json', {'message':'Обновить приложение мастера до ' + ver, 'content':base64.b64encode(content.encode()).decode(), 'sha':current['sha'], 'branch':'main'})
          print('Готово: master-update.json обновлён для ' + tag)
          PYCODE
